name: data-ci
# Runs on every PR (never path-filtered: its jobs are required checks) and on main.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # ledger_check diffs the corpus against the merge base
      - uses: ./.github/actions/lfs-db
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Hash chain — MANIFEST ⇄ corpus ⇄ DB ⇄ reconcile attestation
        run: |
          python3 - <<'PY'
          import json, hashlib, sys
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for ch in iter(lambda: f.read(1 << 20), b''): h.update(ch)
              return h.hexdigest()
          man = json.load(open('MANIFEST.json')); att = json.load(open('validation/reconcile-attestation.json'))
          corpus, db = sha('corpus/sggs.jsonl'), sha('db/sggs.sqlite')
          fails = []
          if man['corpus_sha256'] != corpus: fails.append('MANIFEST.corpus_sha256 != corpus file')
          if man['db_sha256'] != db: fails.append('MANIFEST.db_sha256 != db file')
          if att['corpus_sha256'] != corpus: fails.append('reconcile attestation corpus_sha256 != corpus file')
          if not att.get('reconciled_char_exact') or not att.get('golden_pass'):
              fails.append('reconcile attestation does not record a clean reconcile + golden')
          if man.get('version') != open('DATASET_VERSION').read().strip():
              fails.append('MANIFEST.version != DATASET_VERSION')
          for f in fails: print('::error::' + f)
          sys.exit(1 if fails else 0)
          PY
      - name: Editorial ledger — code == register; scripture changes only via new entries
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python3 pipeline/ledger_check.py
          else
            python3 pipeline/ledger_check.py --base "$BASE"
          fi
      - name: Dataset fingerprint — DB content == audit/dataset-fingerprint.json
        run: python3 pipeline/sggs_integrity.py db/sggs.sqlite --compare audit/dataset-fingerprint.json
      - name: Structural + regroup invariants
        run: python3 pipeline/verify_regroup.py --invariants db/sggs.sqlite
      - name: Guard — pre-existing tables byte-identical to the baseline
        run: python3 pipeline/timing/guard_scripture.py
      - name: Timing-layer tests
        run: python3 pipeline/timing/test_timing_layer.py
      - name: Guard — Nitnem bani registry invariants
        run: python3 pipeline/banis/guard_banis.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lfs-db
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Ruff (bug-only lint gate)
        run: |
          pip install ruff==0.9.10
          ruff check .
      - name: Data-integrity tests (pipeline/tests)
        run: python3 -m unittest discover -s pipeline/tests -v
